name: Fork CI

# Upstream's ci.yml only triggers on `main` and `cypack-*` of ITS repo; this
# fork's main carries our patches, and before this workflow existed nothing
# built or tested them on push. Two stale test fixtures had been broken for a
# release because of it.

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A fork patch that no longer compiles against the rebased upstream API is
      # the failure mode this exists to catch, so build before anything else.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test:run
